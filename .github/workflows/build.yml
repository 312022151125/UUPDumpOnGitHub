name: Builds

on:
  workflow_dispatch:
    inputs:
        filebin_code:
            required: true
            type: string
            description: 'Filebin bin code (e.g. 0uv3y9tjqm0hjb51) or full Filebin URL (e.g. https://filebin.net/0uv3y9tjqm0hjb51)'
            #default: "0uv3y9tjqm0hjb51"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Importing Files
        shell: pwsh
        run: |
           $raw = "${{ inputs.filebin_code }}".Trim()
           if ($raw -match 'filebin\.net/(?:archive/)?([^/?#]+)') {
               $binCode = $matches[1]
           } else {
               $binCode = $raw
           }
           Write-Host "Resolved Filebin bin code: $binCode"

           mkdir win
           cd win
           curl.exe -fSL -o filebin.zip "https://filebin.net/archive/$binCode/zip"
           tar -xf filebin.zip
           del filebin.zip
           ren *.zip win.zip
           tar -xf win.zip
           echo f | xcopy /f /y .\files\converter_multi ..\files\converter_multi
           echo f | xcopy /f /y .\files\converter_windows ..\files\converter_windows
           echo f | xcopy /f /y ConvertConfig.ini ..\ConvertConfig.ini
           echo f | xcopy /f /y CustomAppsList.txt ..\CustomAppsList.txt
           echo f | xcopy /f /y uup_download_windows.cmd ..\start.cmd
           cd ..
        
      - name: Building Windows Image
        run: ./start.cmd

      - name: Upload File & Get Links
        shell: cmd
        run: |
          FOR %%i IN (*.ISO) DO CALL upload.cmd "%%i"
